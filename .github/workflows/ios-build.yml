name: Build iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build simulator app
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build for iOS Simulator
        run: |
          set -euo pipefail
          xcodebuild \
            -project IOSApp.xcodeproj \
            -scheme IOSApp \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/IOSApp-DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/IOSApp-Build.xcresult" \
            CODE_SIGNING_ALLOWED=NO build

      - name: Package simulator application
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/IOSApp-DerivedData/Build/Products/Debug-iphonesimulator/IOSApp.app"
          test -d "$app"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/IOSApp-simulator.zip"

      - name: Upload simulator application
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: IOSApp-simulator-${{ github.sha }}
          path: ${{ runner.temp }}/IOSApp-simulator.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: IOSApp-build-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/IOSApp-Build.xcresult
          if-no-files-found: warn
          retention-days: 7
